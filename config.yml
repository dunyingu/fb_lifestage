run_date: &run_date !sys_date
score_freq: &weeks 13

files: &files
  feat_label_file: !concat [srvy_lifestage_all_feat_label_,*run_date,.csv]
  feat_label_filtered_file: !concat [srvy_lifestage_all_feat_label_filter_isf_,*run_date,.csv]
  train_init_classifier_data_file: !concat [df_train_initi_classifier_,*run_date,.csv]
  init_classifier_model: !concat [init_classifier_xgboost_model_,*run_date]
  transition_endpoint: !concat [lifestage-transition-,*run_date]
  score_output_file: !concat [active_12m_mbr_lifestage_all_score_output_,*run_date,.csv]

